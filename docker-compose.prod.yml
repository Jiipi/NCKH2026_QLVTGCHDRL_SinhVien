# Load environment variables from .env.production
# Make sure to create .env.production before running
# Command: cp .env.example .env.production && nano .env.production

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: student_app_db_prod
    restart: always
    env_file:
      - .env.production
    environment:
      POSTGRES_DB: ${DB_NAME:-Web_QuanLyDiemRenLuyen}
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/backups:/backups
    ports:
      - "127.0.0.1:5433:5432"  # Only expose to localhost
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-Web_QuanLyDiemRenLuyen}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Backend Application
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.production
      args:
        NODE_ENV: production
    image: student-app-backend:latest
    container_name: student_app_backend_prod
    restart: always
    depends_on:
      db:
        condition: service_healthy
      face-recognition:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3001}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN}
      SEMESTER_DATA_DIR: /app/backend/data/semesters
      FACE_RECOGNITION_URL: ${FACE_RECOGNITION_URL:-http://face-recognition:5000}
      FACE_SESSION_REQUIRED: ${FACE_SESSION_REQUIRED:-true}
      FACE_ACTIVE_LIVENESS_REQUIRED: ${FACE_ACTIVE_LIVENESS_REQUIRED:-true}
      FACE_SESSION_STORAGE: ${FACE_SESSION_STORAGE:-db}
      FACE_SESSION_TTL_MS: ${FACE_SESSION_TTL_MS:-120000}
      FACE_SESSION_MIN_CHALLENGES: ${FACE_SESSION_MIN_CHALLENGES:-3}
      FACE_THRESHOLD_ATTENDANCE_1TO1: ${FACE_THRESHOLD_ATTENDANCE_1TO1:-0.68}
      FACE_THRESHOLD_ATTENDANCE_1N: ${FACE_THRESHOLD_ATTENDANCE_1N:-0.72}
      FACE_THRESHOLD_DUPLICATE_REGISTRATION: ${FACE_THRESHOLD_DUPLICATE_REGISTRATION:-0.68}
      FACE_THRESHOLD_VERIFY: ${FACE_THRESHOLD_VERIFY:-0.68}
      FACE_SERVICE_TOKEN: ${FACE_SERVICE_TOKEN:?FACE_SERVICE_TOKEN environment variable must be set}
    volumes:
      - ./backend/logs:/app/backend/logs
      - ./backend/uploads:/app/backend/uploads
      - ./backend/backups:/app/backend/backups
      - ./backend/data:/app/backend/data
    ports:
      - "127.0.0.1:3001:3001"  # Only expose to localhost (nginx will proxy)
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Face Recognition Service (RetinaFace + ArcFace + active liveness)
  face-recognition:
    build:
      context: ./face-recognition-service
      dockerfile: Dockerfile
    image: student-app-face-recognition:latest
    container_name: student_app_face_recognition_prod
    restart: always
    environment:
      ALLOWED_ORIGINS: ${CORS_ORIGIN}
      FACE_THRESHOLD_VERIFY: ${FACE_THRESHOLD_VERIFY:-0.68}
      FACE_SERVICE_TOKEN: ${FACE_SERVICE_TOKEN:?FACE_SERVICE_TOKEN environment variable must be set}
      ACTIVE_LIVENESS_MIN_FRAMES: ${ACTIVE_LIVENESS_MIN_FRAMES:-3}
      ACTIVE_LIVENESS_YAW_RANGE_MIN: ${ACTIVE_LIVENESS_YAW_RANGE_MIN:-0.10}
      ACTIVE_LIVENESS_CENTER_YAW_MAX: ${ACTIVE_LIVENESS_CENTER_YAW_MAX:-0.12}
    volumes:
      - face_models:/root/.insightface
    ports:
      - "127.0.0.1:5000:5000"
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 3G
        reservations:
          cpus: '0.5'
          memory: 1G

  # Frontend Application (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL}
    image: student-app-frontend:latest
    container_name: student_app_frontend_prod
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL}
    ports:
      - "127.0.0.1:3000:80"  # Only expose to localhost
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # Nginx Reverse Proxy (Optional - for production with SSL)
  nginx:
    image: nginx:alpine
    container_name: student_app_nginx_prod
    restart: always
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx-http-only.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    profiles:
      - with-nginx
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

volumes:
  postgres_data:
    driver: local
  face_models:
    driver: local

networks:
  app_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
